{% set name = "aia-chaser" %}
{% set version = "3.4.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/aia_chaser-{{ version }}.tar.gz
  sha256: 3cc3a155530278fda5d84d2f0db630e9b58e7cfeb834e0c4b8c90ed5c51953a8

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - poetry-core
    - pip
    - poetry
  run:
    - python >={{ python_min }},<4.0.0
    - cryptography >=44.0.1
    - tenacity >=8
test:
  imports:
    - aia_chaser
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  summary: Chase authority information access from a host certificate to complete the chain of trust.
  license: MIT
  license_file: LICENSE
  doc_url: https://aia-chaser.readthedocs.io
  dev_url: https://github.com/jponf/aia-chaser
  home: https://github.com/jponf/aia-chaser

extra:
  recipe-maintainers:
    - HeavyTony2
